[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intelbit-river-connector-bitrix24"
description = "Коннектор Bitrix24 (CRM + Торговый каталог) для Интелбит:Река"
version = "0.1.0"
authors = [{ name = "Святослав Михайлов", email = "vceo@intelbit.ru" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "intelbit-bitrix24-client",
    "intelbit-river-sdk",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "respx",
    "fastapi",
    "httpx[asgi]",
    "python-multipart",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/SvyatoslavMikhailov/intelbit-river-connector-bitrix24"
Repository = "https://github.com/SvyatoslavMikhailov/intelbit-river-connector-bitrix24"

[tool.uv.sources]
intelbit-bitrix24-client = { path = "../intelbit-bitrix24-client", editable = true }
intelbit-river-sdk = { path = "../intelbit-river-monorepo/packages/sdk", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001/002/003 — кириллические «двойники»; проект ведёт комментарии по-русски.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "contract: contract-тесты против FastAPI-мока Bitrix24 (ASGITransport)",
]
