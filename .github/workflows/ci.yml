name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Коннектор зависит от соседних репо по path; для CI их нужно подложить рядом.
          path: intelbit-river-connector-bitrix24

      - uses: actions/checkout@v4
        with:
          repository: SvyatoslavMikhailov/intelbit-bitrix24-client
          path: intelbit-bitrix24-client

      - uses: actions/checkout@v4
        with:
          repository: SvyatoslavMikhailov/intelbit-river-monorepo
          path: intelbit-river-monorepo

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync
        working-directory: intelbit-river-connector-bitrix24
        run: uv sync --extra dev

      - name: Ruff
        working-directory: intelbit-river-connector-bitrix24
        run: uv run ruff check .

      - name: Mypy (strict)
        working-directory: intelbit-river-connector-bitrix24
        run: uv run mypy

      - name: Pytest
        working-directory: intelbit-river-connector-bitrix24
        run: uv run pytest
